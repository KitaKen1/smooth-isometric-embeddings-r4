name = "smoothIsometricEmbeddingsR4"
version = "1.0.0"
defaultTargets = ["R4Initial"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# Core definitions, the complete statement and its reductions.
[[lean_lib]]
name = "R4Embedding"

[[lean_lib]]
name = "R4ModelAtlas"
srcDir = "model_atlas"
moreLeanArgs = ["-DautoImplicit=false"]

# The pinned analytic construction (Apache-2.0, see upstream/LICENSE).
[[lean_lib]]
name = "OAI"
srcDir = "upstream"
moreLeanArgs = ["-DautoImplicit=false"]

# Same-output adapters from the analytic construction to the statement.
[[lean_lib]]
name = "R4Analytic"
srcDir = "analytic"
moreLeanArgs = ["-DautoImplicit=false"]

# Parts of differential-geometry (Apache-2.0, see models_upstream/LICENSE), with its own options.
[[lean_lib]]
name = "DifferentialGeometry"
srcDir = "models_upstream"
leanOptions = { autoImplicit = false, maxSynthPendingDepth = 3 }

# The classification of surfaces, under the renamed namespace R4CoS (see stage07/VENDOR-CLASH.md).
[[lean_lib]]
name = "R4CoS"
srcDir = "stage07/vendor"
globs = ["R4CoS.*"]
leanOptions = { autoImplicit = true, relaxedAutoImplicit = false, maxSynthPendingDepth = 3 }

# The initial embedding of every closed orientable surface and the final theorem.
[[lean_lib]]
name = "R4Initial"
srcDir = "stage07"
globs = ["R4Initial.*"]
leanOptions = { autoImplicit = false }
